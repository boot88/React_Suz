<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360" role="img" aria-label="Decorative spectrum lines">
  <defs>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="spectral-stripes" width="16" height="360" patternUnits="userSpaceOnUse">
      <rect width="2" height="360" x="0" fill="#1412ff"/>
      <rect width="1" height="360" x="2" fill="#52d4ff"/>
      <rect width="2" height="360" x="3" fill="#05062a"/>
      <rect width="1" height="360" x="5" fill="#ec2eff"/>
      <rect width="2" height="360" x="6" fill="#1700d8"/>
      <rect width="1" height="360" x="8" fill="#00d4ff"/>
      <rect width="2" height="360" x="9" fill="#090926"/>
      <rect width="1" height="360" x="11" fill="#ff42db"/>
      <rect width="2" height="360" x="12" fill="#2016ff"/>
      <rect width="1" height="360" x="14" fill="#73e7ff"/>
      <rect width="1" height="360" x="15" fill="#03031c"/>
    </pattern>
  </defs>
  <rect width="1600" height="360" fill="url(#spectral-stripes)"/>
  <rect width="1600" height="360" fill="url(#fade)"/>
</svg>
