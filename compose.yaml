name: react-suz-test

services:
  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: its_test
      MYSQL_USER: react_suz
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: its_test
      MYSQL_USER: react_suz
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET}

    volumes:
      - ./runtime/uploads:/app/server/uploads
      - ./runtime/data:/app/server/data

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
