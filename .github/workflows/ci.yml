name: CI

on:
  push:
    branches:
      - main
      - codex/fix-feed-mutations
      - dev/test-stand
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Server tests (node:test)
        run: npm run test:server

      - name: Client tests (jest)
        run: npm test -- --watchAll=false

      - name: Production build
        run: npm run build

      - name: Server syntax check
        run: node --check server/server.js
   
  docker:
    needs: test-and-build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/test-stand'

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/boot88/react_suz
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            docker login ghcr.io \
              -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:test"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:test" 
